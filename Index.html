<!DOCTYPE html>
<html lang="es">
<!-- Nombre: [Tu nombre] | Documento: [Tu número] -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Nómina</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
 
  <h1>Simulador de Prestaciones 2026</h1>
 
  <form id="datosGenerales">
    <label>Nombre <input type="text" id="nombre"></label>
    <label>Edad <input type="text" id="edad"></label>
    <label>Tipo de documento
      <select id="tipoDocumento">
        <option value="">-- Seleccione --</option>
        <option value="RC">RC</option>
        <option value="TI">TI</option>
        <option value="CC">CC</option>
        <option value="CE">CE</option>
        <option value="PP">PP</option>
      </select>
    </label>
    <label>Número de documento <input type="text" id="numeroDocumento"></label>
    <button type="submit">Continuar</button>
  </form>
 
  <form id="datosSalariales" style="display:none; flex-direction:column;">
    <label>Salario <input type="text" id="salario"></label>
    <label>Comisiones <input type="text" id="comisiones"></label>
    <label>Horas extra <input type="text" id="horasExtra"></label>
    <label>Nivel de riesgo ARL
      <select id="nivelRiesgo">
        <option value="">-- Seleccione --</option>
        <option value="0">Riesgo I – Mínimo (0.522%)</option>
        <option value="1">Riesgo II – Bajo (1.044%)</option>
        <option value="2">Riesgo III – Medio (2.436%)</option>
        <option value="3">Riesgo IV – Alto (4.350%)</option>
        <option value="4">Riesgo V – Máximo (6.960%)</option>
      </select>
    </label>
    <button type="submit">Calcular</button>
  </form>
 
  <ul id="errores" style="display:none"></ul>
 
  <div id="resultados" style="display:none;">
    <p id="salarioRes"></p>
    <p id="comisionesRes"></p>
    <p id="horasExtraRes"></p>
    <p id="totalDev"></p>
    <p id="ibc"></p>
    <p id="auxTransporte"></p>
    <p id="salud"></p>
    <p id="pension"></p>
    <p id="fondoSolidaridad"></p>
    <p id="arl"></p>
    <p id="totalDed"></p>
    <p id="neto"></p>
  </div>
 
  <script src="script.js"></script>
</body>
</html>
